<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout CAdE Interativo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body, html { width: 100%; height: 100%; background: #f8fafc; overflow: hidden; }

    /* GRADE PRINCIPAL DA IMAGEM */
    .grid-container {
      display: grid;
      grid-template-columns: 60px 220px 1fr 300px;
      grid-template-rows: 1fr 120px;
      height: 100vh;
      width: 100vw;
      gap: 1px;
      background-color: #cbd5e1;
    }

    .bloco { background: #ffffff; padding: 12px; display: flex; flex-direction: column; }

    /* 1. BARRA LATERAL (ICONES) */
    .barra-icones {
      grid-row: 1 / 3;
      background: #f1f5f9;
      align-items: center;
      gap: 16px;
      padding-top: 16px;
    }

    .btn-icon {
      width: 40px; height: 40px; border-radius: 50%; background: #fff;
      border: 1px solid #cbd5e1; display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 16px; transition: 0.2s;
    }
    .btn-icon:hover { background: #0284c7; color: white; border-color: #0284c7; }

    /* 2. COLUNA ESQUERDA */
    .coluna-esquerda {
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 1px;
      background-color: #cbd5e1;
    }

    .card-menu {
      background: #ffffff; padding: 14px; cursor: pointer;
      display: flex; flex-direction: column; justify-content: center; transition: 0.2s;
    }
    .card-menu:hover { background: #f0f9ff; }

    .card-azul {
      border: 2px solid #0284c7 !important;
      background: #f0f9ff;
    }

    /* 3. PAINEL CENTRAL (CINZA COM ANIMAÇÃO) */
    .painel-central {
      background-color: #ffffff;
      padding: 24px;
      overflow-y: auto;
      position: relative;
    }

    .conteudo-wrapper {
      transition: opacity 0.3s ease, transform 0.3s ease;
      opacity: 1;
      transform: translateY(0);
    }

    .conteudo-wrapper.saindo {
      opacity: 0;
      transform: translateY(10px);
    }

    /* 4. BLOCO INFERIOR CENTRAL */
    .bloco-inferior {
      grid-column: 2 / 4;
      background-color: #ffffff;
    }

    /* 5. COLUNA DIREITA */
    .coluna-direita {
      grid-row: 1 / 3;
      display: grid;
      grid-template-rows: 280px 1fr;
      gap: 1px;
      background-color: #cbd5e1;
    }
  </style>
</head>
<body>

  <div class="grid-container">

    <!-- 1. BARRA LATERAL -->
    <div class="bloco barra-icones">
      <div class="btn-icon" onclick="enviarParaMoodle('conteudo-inicio')" title="Início">🏠</div>
      <div class="btn-icon" onclick="enviarParaMoodle('conteudo-modulo1')" title="Módulos">📚</div>
      <div class="btn-icon" onclick="enviarParaMoodle('conteudo-avisos')" title="Avisos">📢</div>
    </div>

    <!-- 2. COLUNA ESQUERDA -->
    <div class="coluna-esquerda">
      <div class="card-menu" onclick="enviarParaMoodle('conteudo-modulo1')">
        <h4 style="font-size: 14px; color: #0f172a;">📘 Módulo 1</h4>
        <p style="font-size: 12px; color: #64748b;">Clique para ver</p>
      </div>

      <!-- Card azul destacado -->
      <div class="card-menu card-azul" onclick="enviarParaMoodle('conteudo-tarefas')">
        <h4 style="font-size: 14px; color: #0284c7;">✏️ Tarefas & Prazos</h4>
        <p style="font-size: 12px; color: #64748b;">Ver atividades</p>
      </div>
    </div>

    <!-- 3. PAINEL CENTRAL DA GRADE (RECEBE O HTML DO MOODLE) -->
    <div class="bloco painel-central">
      <div id="wrapper" class="conteudo-wrapper">
        <h3 style="color: #0f172a;">Carregando conteúdo...</h3>
      </div>
    </div>

    <!-- 4. BLOCO INFERIOR -->
    <div class="bloco bloco-inferior">
      <h4 style="font-size: 13px; color: #334155; margin-bottom: 4px;">📢 Quadro de Avisos Gerais</h4>
      <p style="font-size: 12px; color: #64748b;">Recados rápidos da coordenação do curso.</p>
    </div>

    <!-- 5. DIREITA (CALENDÁRIO + EVENTOS) -->
    <div class="coluna-direita">
      <div class="bloco" style="padding: 4px;">
        <iframe src="https://calendar.google.com/calendar/embed?src=renevieiragenrokol%40gmail.com&ctz=America%2FSao_Paulo" 
                style="border:0; width:100%; height:100%; border-radius:4px;" frameborder="0" scrolling="no">
        </iframe>
      </div>
      <div class="bloco">
        <h4 style="font-size: 13px; color: #d97706; margin-bottom: 6px;">🔔 Próximas Entregas</h4>
        <ul style="padding-left: 14px; font-size: 12px; color: #475569;">
          <li>28/07 - Módulo 1</li>
          <li>05/08 - Aula RNP</li>
        </ul>
      </div>
    </div>

  </div>

  <script>
    // MANDA A ORDEM PARA O MOODLE MANDAR O HTML
    function enviarParaMoodle(idDiv) {
      window.parent.postMessage({ acao: 'SOLICITAR_CONTEUDO', id: idDiv }, '*');
    }

    // RECEBE O HTML DO MOODLE E ATUALIZA A TELA CENTRAL COM ANIMAÇÃO
    window.addEventListener('message', function(event) {
      if (event.data && event.data.acao === 'EXIBIR_CONTEUDO') {
        const wrapper = document.getElementById('wrapper');
        
        wrapper.classList.add('saindo');
        setTimeout(() => {
          wrapper.innerHTML = event.data.html;
          wrapper.classList.remove('saindo');
        }, 200);
      }
    });

    // Ao carregar, pede o conteúdo da página inicial
    window.onload = function() {
      enviarParaMoodle('conteudo-inicio');
    };
  </script>

</body>
</html>
