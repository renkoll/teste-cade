<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout CAdE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body, html { width: 100%; height: 100%; background: #f8fafc; overflow: hidden; }

    /* GRADE DA IMAGEM 2 */
    .grid-container {
      display: grid;
      grid-template-columns: 60px 220px 1fr 300px;
      grid-template-rows: 1fr 120px;
      height: 100vh;
      width: 100vw;
      gap: 1px;
      background-color: #cbd5e1;
    }

    .bloco { background: #ffffff; padding: 12px; display: flex; flex-direction: column; }

    /* BARRA LATERAL (ICONES) */
    .barra-icones {
      grid-row: 1 / 3;
      background: #f1f5f9;
      align-items: center;
      gap: 16px;
      padding-top: 16px;
    }

    .btn-icon {
      width: 40px; height: 40px; border-radius: 50%; background: #fff;
      border: 1px solid #cbd5e1; display: flex; align-items: center; justify-content: center;
      font-size: 16px; color: #334155;
    }

    /* COLUNA ESQUERDA */
    .coluna-esquerda {
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 1px;
      background-color: #cbd5e1;
    }

    .card-menu {
      background: #ffffff; padding: 14px;
      display: flex; flex-direction: column; justify-content: center;
    }

    .card-azul {
      border: 2px solid #0284c7 !important;
      background: #f0f9ff;
    }

    /* PAINEL CENTRAL VACANT (RESERVADO PARA O MOODLE) */
    .painel-central {
      background-color: #f1f5f9;
      justify-content: center; align-items: center; text-align: center;
    }

    /* BLOCO INFERIOR CENTRAL */
    .bloco-inferior {
      grid-column: 2 / 4;
      background-color: #ffffff;
    }

    /* COLUNA DIREITA */
    .coluna-direita {
      grid-row: 1 / 3;
      display: grid;
      grid-template-rows: 280px 1fr;
      gap: 1px;
      background-color: #cbd5e1;
    }
  </style>
</head>
<body>

  <div class="grid-container">
    <!-- ÍCONES -->
    <div class="bloco barra-icones">
      <div class="btn-icon">🏠</div>
      <div class="btn-icon">📚</div>
      <div class="btn-icon">📢</div>
    </div>

    <!-- ESQUERDA -->
    <div class="coluna-esquerda">
      <div class="card-menu">
        <h4 style="font-size: 14px; color: #0f172a;">📘 Módulo 1</h4>
        <p style="font-size: 12px; color: #64748b;">Conteúdo da disciplina</p>
      </div>

      <div class="card-menu card-azul">
        <h4 style="font-size: 14px; color: #0284c7;">✏️ Tarefas & Prazos</h4>
        <p style="font-size: 12px; color: #64748b;">Atividades abertas</p>
      </div>
    </div>

    <!-- CENTRO -->
    <div class="bloco painel-central">
      <p style="color: #94a3b8; font-size: 13px;">[ Modulo / Conteúdo do Moodle ]</p>
    </div>

    <!-- INFERIOR -->
    <div class="bloco bloco-inferior">
      <h4 style="font-size: 13px; color: #334155; margin-bottom: 4px;">📢 Quadro de Avisos Gerais</h4>
      <p style="font-size: 12px; color: #64748b;">Avisos estáticos e atualizações da coordenação.</p>
    </div>

    <!-- DIREITA -->
    <div class="coluna-direita">
      <div class="bloco" style="padding: 4px;">
        <iframe src="https://calendar.google.com/calendar/embed?src=renevieiragenrokol%40gmail.com&ctz=America%2FSao_Paulo" 
                style="border:0; width:100%; height:100%; border-radius:4px;" frameborder="0" scrolling="no">
        </iframe>
      </div>
      <div class="bloco">
        <h4 style="font-size: 13px; color: #d97706; margin-bottom: 6px;">🔔 Próximas Entregas</h4>
        <ul style="padding-left: 14px; font-size: 12px; color: #475569;">
          <li>28/07 - Módulo 1</li>
          <li>05/08 - Aula RNP</li>
        </ul>
      </div>
    </div>
  </div>

</body>
</html>
