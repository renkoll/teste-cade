<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: #f8fafc; padding: 10px; }

    /* LAYOUT PRINCIPAL */
    .grid-container {
      display: grid;
      grid-template-columns: 60px 240px 1fr 320px;
      gap: 1px;
      background: #cbd5e1;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      overflow: hidden;
      min-height: 520px;
    }

    .col { background: #fff; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    
    /* ANIMAÇÃO FLUIDA */
    .painel-conteudo {
      transition: opacity 0.4s ease, transform 0.4s ease;
      opacity: 1;
      transform: translateY(0);
    }

    .painel-conteudo.escondido {
      opacity: 0;
      transform: translateY(10px);
    }

    /* BOTÕES */
    .btn-icon {
      width: 40px; height: 40px; border-radius: 50%; background: #f1f5f9;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: 0.2s;
    }
    .btn-icon:hover { background: #0284c7; color: white; }

    .card {
      padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px;
      cursor: pointer; transition: 0.2s;
    }
    .card:hover { border-color: #0284c7; background: #f0f9ff; }
  </style>
</head>
<body>

<div class="grid-container">
  <!-- MENU LATERAL -->
  <div class="col" style="align-items: center; background: #f8fafc;">
    <div class="btn-icon" onclick="carregar('Módulo 1', 'Conteúdo animado do Módulo 1')">🏠</div>
    <div class="btn-icon" onclick="carregar('Aulas', 'Lista completa de gravações')">📚</div>
    <div class="btn-icon" onclick="carregar('Configurações', 'Planos de ensino')">⚙️</div>
  </div>

  <!-- LISTA -->
  <div class="col">
    <div class="card" onclick="carregar('Aula 1', 'Introdução às metodologias')">📘 Aula 1</div>
    <div class="card" onclick="carregar('Aula 2', 'Desenvolvimento do Projeto')">📂 Aula 2</div>
  </div>

  <!-- CONTEÚDO CENTRAL -->
  <div class="col" style="background: #ffffff; justify-content: center; align-items: center; text-align: center;">
    <div id="painel" class="painel-conteudo">
      <h2 id="titulo">Bem-vindo</h2>
      <p id="texto">Selecione uma opção para visualizar.</p>
    </div>
  </div>

  <!-- CALENDÁRIO EXTERNO -->
  <div class="col">
    <iframe src="https://calendar.google.com/calendar/embed?src=renevieiragenrokol%40gmail.com&ctz=America%2FSao_Paulo" 
            style="width: 100%; height: 100%; border:0;"></iframe>
  </div>
</div>

<script>
  function carregar(titulo, texto) {
    const painel = document.getElementById('painel');
    
    // Animação de saída
    painel.classList.add('escondido');
    
    setTimeout(() => {
      document.getElementById('titulo').innerText = titulo;
      document.getElementById('texto').innerText = texto;
      // Animação de entrada
      painel.classList.remove('escondido');
    }, 300);
  }
</script>

</body>
</html>
